name: Publish site

on:
  # Every push to main rebuilds the site from the repository, so catalog,
  # receipt, script and format-registry changes all reach parsarium.com.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Rebuild catalog counts and parser guides
        run: |
          python3 scripts/audit_projects.py --write
          python3 scripts/build_readmes.py
      - name: Build static site from catalog evidence
        run: python3 website/build.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
