name: Verify catalog and tooling

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check selection and evidence records
        run: python3 scripts/validate_catalog.py
      - name: Check runnable targets and source receipts
        run: python3 scripts/audit_projects.py
      - name: Check AFL++ overlays and feedback receipts
        run: python3 scripts/audit_fuzzing.py
      - name: Test catalog, package paths, and fuzz tooling
        run: python3 -m unittest discover -s tests -q
      - name: Build the catalog website
        run: python3 website/build.py --output /tmp/parsarium-site

  package:
    # Build the wheel exactly as a release would and use it outside the checkout,
    # so packaging problems show up before a version tag is pushed.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test the package modules
        run: python3 -m unittest tests.test_package_cli tests.test_package_runtime -q
      - name: Build the snapshot and wheel
        run: |
          version=$(python3 -c "import re,pathlib;print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/parsarium/__init__.py').read_text()).group(1))")
          python3 scripts/build_snapshot.py --version "$version" --out dist-snapshot --write-package
          python3 -m pip install --upgrade build
          python3 -m build
      - name: Smoke test the installed wheel without repository access
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          export PARSARIUM_CACHE=/tmp/cache
          unset PARSARIUM_HOME PARSARIUM_SNAPSHOT_URL PARSARIUM_SNAPSHOT_SHA256
          mkdir -p /tmp/smoke && cd /tmp/smoke
          /tmp/venv/bin/parsarium --version
          /tmp/venv/bin/parsarium home --fetch
          /tmp/venv/bin/parsarium list --format png
          /tmp/venv/bin/parsarium projects --format json --ecosystem rust
          /tmp/venv/bin/python -c "from parsarium import catalog; t = catalog.targets(); assert len(t) > 1000, len(t); print(len(t), 'runnable targets')"
