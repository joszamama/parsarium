name: Release package

# Push a tag such as v2026.11.16 whose version matches src/parsarium/__init__.py.
# The job builds the snapshot from that commit, embeds it in the wheel,
# records its SHA-256 in the package, and publishes to PyPI with trusted publishing.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check tag matches package version
        run: |
          version="${GITHUB_REF_NAME#v}"
          package=$(python3 -c "import re,pathlib;print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/parsarium/__init__.py').read_text()).group(1))")
          test "$version" = "$package" || { echo "tag $version does not match package $package"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Test package snapshot paths
        run: python3 -m unittest tests.test_package_cli -q
      - name: Build snapshot
        run: python3 scripts/build_snapshot.py --version "$VERSION" --out dist-snapshot --write-package
      - name: Build package
        run: |
          python3 -m pip install --upgrade build
          python3 -m build
      - name: Smoke test the installed wheel without repository access
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          export PARSARIUM_CACHE=/tmp/cache
          unset PARSARIUM_HOME PARSARIUM_SNAPSHOT_URL PARSARIUM_SNAPSHOT_SHA256
          # Run outside the checkout, where ./parsarium.py would shadow the installed package.
          mkdir -p /tmp/smoke && cd /tmp/smoke
          /tmp/venv/bin/parsarium home --fetch
          /tmp/venv/bin/parsarium list --format png
          /tmp/venv/bin/python -c "from parsarium import catalog; print(len(catalog.targets()), 'runnable targets')"
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@v5
        with:
          name: snapshot
          path: dist-snapshot/*.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/parsarium
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
