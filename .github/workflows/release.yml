name: Release package

# Push a tag such as v2026.11.16 whose version matches src/parsarium/__init__.py.
# The job builds the snapshot from that commit, attaches it to a GitHub release,
# records its SHA-256 in the package, and publishes to PyPI with trusted publishing.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check tag matches package version
        run: |
          version="${GITHUB_REF_NAME#v}"
          package=$(python3 -c "import re,pathlib;print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/parsarium/__init__.py').read_text()).group(1))")
          test "$version" = "$package" || { echo "tag $version does not match package $package"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Build snapshot
        run: python3 scripts/build_snapshot.py --version "$VERSION" --out dist-snapshot --write-package
      - name: Build package
        run: |
          python3 -m pip install --upgrade build
          python3 -m build
      - name: Smoke test the wheel against the new snapshot
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          snapshot=$(ls dist-snapshot/*.tar.gz)
          PARSARIUM_CACHE=/tmp/cache PARSARIUM_SNAPSHOT_URL="$PWD/$snapshot" /tmp/venv/bin/parsarium home --fetch
          PARSARIUM_CACHE=/tmp/cache PARSARIUM_SNAPSHOT_URL="$PWD/$snapshot" /tmp/venv/bin/parsarium list --format png
          PARSARIUM_CACHE=/tmp/cache PARSARIUM_SNAPSHOT_URL="$PWD/$snapshot" /tmp/venv/bin/python -c "from parsarium import catalog; print(len(catalog.targets()), 'runnable targets')"
      - name: Create GitHub release with the snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist-snapshot/*.tar.gz \
            --title "Parsarium $VERSION" \
            --notes "Snapshot for \`pip install parsarium==$VERSION\`. SHA-256 is recorded in the package."
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/parsarium
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
