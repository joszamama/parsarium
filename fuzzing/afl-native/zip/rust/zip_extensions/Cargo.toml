[package]
name = "parsarium-zip-zip-extensions-harness"
version = "0.1.0"
edition = "2024"

[dependencies]
afl = "=0.18.2"
serde_json = "=1.0.145"
zip-extensions = { version = "=0.14.1", default-features = false, features = ["deflate"] }
zip-extract = { version = "=0.4.1", default-features = false, features = ["deflate"] }
libfuzzer-sys = { version = "=0.4.13", optional = true }

[features]
fuzzing = ["dep:libfuzzer-sys"]

[[bin]]
name = "replay"
path = "src/bin/replay.rs"

[[bin]]
name = "fuzzer"
path = "src/bin/fuzzer.rs"
required-features = ["fuzzing"]

[[bin]]
name = "afl_fuzzer"
path = "src/bin/afl_fuzzer.rs"
