[package]
name = "parsarium-ascii-pnm-fltk-harness"
version = "0.1.0"
edition = "2024"

[dependencies]
afl = "=0.18.2"
# No fltk-bundled: that feature downloads an unpinned, uninstrumented cfltk
# archive. The default path builds the FLTK 1.4.5 source vendored in fltk-sys.
fltk = { version = "=1.5.23", features = ["no-pango"] }
serde_json = "=1.0.154"
libfuzzer-sys = { version = "=0.4.13", optional = true }

[features]
fuzzing = ["dep:libfuzzer-sys"]

[[bin]]
name = "replay"
path = "src/bin/replay.rs"

[[bin]]
name = "fuzzer"
path = "src/bin/fuzzer.rs"
required-features = ["fuzzing"]

[[bin]]
name = "afl_fuzzer"
path = "src/bin/afl_fuzzer.rs"
