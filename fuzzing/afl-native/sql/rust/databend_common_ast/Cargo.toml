[package]
name = "parsarium-sql-databend-common-ast-harness"
version = "0.1.0"
edition = "2024"

[dependencies]
afl = "=0.18.2"
databend-common-ast = "=0.2.5"
derive-visitor = { version = "=0.4.0", features = ["std-types-drive"] }
serde_json = "=1.0.154"
libfuzzer-sys = { version = "=0.4.13", optional = true }

[features]
fuzzing = ["dep:libfuzzer-sys"]

[[bin]]
name = "replay"
path = "src/bin/replay.rs"

[[bin]]
name = "fuzzer"
path = "src/bin/fuzzer.rs"
required-features = ["fuzzing"]

[[bin]]
name = "afl_fuzzer"
path = "src/bin/afl_fuzzer.rs"
