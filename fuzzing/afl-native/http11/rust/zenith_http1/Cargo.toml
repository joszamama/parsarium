[package]
name = "parsarium-http11-zenith-http1-harness"
version = "0.1.0"
edition = "2024"

[dependencies]
afl = "=0.18.2"
http-muncher = "=0.3.2"
http_parser = "=0.0.2"
serde_json = "=1.0.145"
zenith-http1 = "=0.1.1"
libfuzzer-sys = { version = "=0.4.13", optional = true }

[features]
fuzzing = ["dep:libfuzzer-sys"]

[[bin]]
name = "replay"
path = "src/bin/replay.rs"

[[bin]]
name = "fuzzer"
path = "src/bin/fuzzer.rs"
required-features = ["fuzzing"]

[[bin]]
name = "afl_fuzzer"
path = "src/bin/afl_fuzzer.rs"
