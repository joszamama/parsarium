[package]
name = "parsarium-svg-ps-anyrender-svg-harness"
version = "0.1.0"
edition = "2024"

[dependencies]
afl = "=0.18.2"
kurbo = "=0.13.1"
ps_anyrender = { package = "ps-anyrender", version = "=0.13.0" }
ps_anyrender_svg = { package = "ps-anyrender-svg", version = "=0.15.0", default-features = false }
serde_json = "=1.0.145"
usvg = { package = "usvg", version = "=0.50.0", default-features = false }
libfuzzer-sys = { version = "=0.4.13", optional = true }

[features]
fuzzing = ["dep:libfuzzer-sys"]

[[bin]]
name = "replay"
path = "src/bin/replay.rs"

[[bin]]
name = "fuzzer"
path = "src/bin/fuzzer.rs"
required-features = ["fuzzing"]

[[bin]]
name = "afl_fuzzer"
path = "src/bin/afl_fuzzer.rs"
