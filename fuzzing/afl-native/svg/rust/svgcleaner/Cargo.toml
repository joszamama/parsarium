[package]
name = "parsarium-svg-svgcleaner-harness"
version = "0.1.0"
edition = "2024"

[dependencies]
afl = "=0.18.2"
serde_json = "=1.0.145"
svgcleaner = { version = "=0.9.5", default-features = false }
svgdom_old = { package = "svgdom", version = "=0.10.5" }
usvg = { package = "usvg", version = "=0.50.0", default-features = false }
libfuzzer-sys = { version = "=0.4.13", optional = true }

[features]
fuzzing = ["dep:libfuzzer-sys"]

[[bin]]
name = "replay"
path = "src/bin/replay.rs"

[[bin]]
name = "fuzzer"
path = "src/bin/fuzzer.rs"
required-features = ["fuzzing"]

[[bin]]
name = "afl_fuzzer"
path = "src/bin/afl_fuzzer.rs"
