[package]
name = "parsarium-rust-ascii-ply"
version = "0.1.0"
edition = "2024"

[dependencies]
ply-rs-bw = "=4.0.1"
ply-rs = "=0.1.3"
serde-ply = "=0.2.2"
threecrate-io = "=0.12.1"
brepkit-io = "=4.11.3"
draco-io = { version = "=0.6.1", default-features = false, features = ["ply-reader"] }
wblidar = "=0.1.3"
rigidity-io = "=0.2.0"
cortenforge-mesh-io = "=0.9.0"
point-formats = "=0.3.1"
ferrum_cloud = "=0.1.0"
modelz = "=0.1.5"
threecrate = { version = "=0.12.1", default-features = false, features = ["io"] }
terrio = "=0.8.0"
rs-read-trimesh = { version = "=2.1.1", default-features = false, features = ["parry_28"] }
ply2splat = { version = "=0.6.0", default-features = false }
cumulus3d-core = "=0.11.1"
kosm-scan = "=0.0.1"
voxel-tiler-core = { version = "=0.3.2", default-features = false, features = ["ply"] }
zumen-ply = "=0.2.0"
zumen-sdk = "=0.2.0"
zumen-base = "=0.2.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
