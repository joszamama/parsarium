[package]
name = "parsarium-rust-ascii-pnm"
version = "0.1.0"
edition = "2024"

[dependencies]
image = { version = "=0.25.10", default-features = false, features = ["pnm"] }
imageun = { version = "=0.0.0", default-features = false, features = ["pnm"] }
imagesize = { version = "=0.15.0", default-features = false, features = ["pnm"] }
bevy_image = { version = "=0.20.1", default-features = false, features = ["pnm"] }
bevy_asset = "=0.20.1"
bevy = { version = "=0.20.1", default-features = false, features = ["bevy_image", "pnm"] }
ai-image = { version = "=0.25.10", default-features = false, features = ["pnm", "std"] }
devela = { version = "=0.30.0", default-features = false, features = ["image"] }
oxideav-pbm = "=0.0.5"
oxideav-image = "=0.0.7"
oxideav-io = { version = "=0.1.2", default-features = false, features = ["registry"] }
zenbitmaps = "=0.1.5"
enough = "=0.4.3"
coldiron = "=0.1.0"
photocraft = "=0.1.2"
libviprs = "=0.6.1"
opencv-no-c-imgcodecs = "=0.1.0"
opencv-no-c-core = "=0.1.0"
rusty-ppm = "=0.3.0"
roka-qr = "=0.1.1"
unicraft = { version = "=0.1.2", default-features = false, features = ["2d"] }
serde_json = "=1.0.154"
