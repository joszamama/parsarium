[package]
name = "parsarium-rust-zip"
version = "0.1.0"
edition = "2024"

[dependencies]
zip = { version = "=9.5.1", default-features = false, features = ["deflate"] }
eazip = { version = "=0.2.7", default-features = false, features = ["std", "deflate"] }
rc-zip-sync = "=4.4.2"
rawzip = "=0.5.2"
tinyzip = { version = "=0.4.0", features = ["std"] }
piz = "=0.5.1"
zip_next = "=1.1.1"
zip-lzma = { version = "=0.6.3", default-features = false, features = ["deflate"] }
zip-extract = { version = "=0.4.1", default-features = false, features = ["deflate"] }
zip-extensions = { version = "=0.14.1", default-features = false, features = ["deflate"] }
oxiarc-archive = "=0.4.2"
openpack = "=0.2.7"
s-zip = "=0.15.0"
archiver-rs = { version = "=0.5.1", default-features = false, features = ["zip"] }
zip_structs = "=0.2.1"
upstream_async_zip = { package = "async_zip", version = "=0.0.19", features = ["deflate"] }
astral_async_zip = { package = "astral_async_zip", version = "=0.0.22", features = ["deflate-read"] }
archive-core = "=0.1.6"
zip-forensic-core = "=0.2.3"
libarchive2 = "=0.2.1"
futures-lite = "=2.6.1"
pollster = "=0.4.0"
flate2 = "=1.1.5"
serde_json = "=1.0.145"
tempfile = "=3.23.0"
