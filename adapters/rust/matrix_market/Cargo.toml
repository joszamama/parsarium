[package]
name = "parsarium-rust-matrix-market"
version = "0.1.0"
edition = "2024"

[dependencies]
sprs = { version = "=0.11.6", default-features = false }
matrix-market-rs = "=0.1.3"
matrix_merchant = "=0.1.2"
sci-io = { version = "=0.1.0", default-features = false, features = ["matrix-market"] }
fsci-io = "=0.4.0"
nalgebra = { version = "=0.35.0", default-features = false, features = ["std", "io", "sparse"] }
powerio-matrix = "=0.11.11"
feral = "=0.22.0"
oxiblas-sparse = "=0.2.3"
russell_sparse = "=5.1.0"
scirs2-io = { version = "=0.6.5", default-features = false }
legume-numeric = { version = "=0.9.8", default-features = false, features = ["matrix"] }
cyanea-omics = { version = "=0.1.1", features = ["single-cell"] }
rma = "=0.4.0"
kira-scio = "=0.2.1"
rlst = "=0.12.0"
rivrs-sparse = "=0.1.1"
ls_solver = "=0.1.0"
serde_json = "=1.0.154"
