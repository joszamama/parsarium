[package]
name = "parsarium-rust-wav"
version = "0.1.0"
edition = "2024"

[dependencies]
hound = "=3.5.1"
wav = "=1.0.1"
wav_io = "=0.1.17"
riff-wave = "=0.1.3"
wavers = { version = "=1.5.1", default-features = false }
