wave_stream = "=0.6.0"
creak = { version = "=0.3.0", default-features = false, features = ["wav"] }
pure_wav = "=2.0.0"
symphonia-format-wav = "=0.5.5"
symphonia_core_05 = { package = "symphonia-core", version = "=0.5.5" }
