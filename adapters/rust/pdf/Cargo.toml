[package]
name = "parsarium-rust-pdf"
version = "0.1.0"
edition = "2024"

[dependencies]
lopdf = { version = "=0.47.0", default-features = false }
pdf-extract = "=0.12.1"
printpdf = { version = "=0.12.9", default-features = false }
pdf-inspector = "=1.25.2"
pdf_oxide = { version = "=0.3.78", default-features = false }
oxidize-pdf = { version = "=5.5.7", default-features = false, features = ["compression"] }
pdf = "=0.10.0"
pdf-text-extract = "=0.2.0"
pdfsink-rs = "=0.2.20"
pdfpurr = { version = "=0.4.0", default-features = false }
pdf-cos = { version = "=0.39.0", default-features = false }
pdfrum = { version = "=0.5.3", default-features = false }
pdfrum-parser = "=0.5.3"
zpdf = { version = "=0.18.0", default-features = false }
zpdf-document = "=0.18.0"
pdfboss-core = "=2.16.1"
unpdf = { version = "=0.54.0", default-features = false }
pdfer_forms = "=0.3.4"
pdfplumber = "=0.4.1"
pdf-syntax = "=0.6.2"
flpdf = "=0.10.0"
serde_json = "=1.0.145"
