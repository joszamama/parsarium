[package]
name = "parsarium-ascii-ply-rs-read-trimesh-harness"
version = "0.1.0"
edition = "2024"

[dependencies]
rs-read-trimesh = { version = "=2.1.1", default-features = false, features = ["parry_28"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
libfuzzer-sys = { version = "=0.4.13", optional = true }

[features]
fuzzing = ["dep:libfuzzer-sys"]

[[bin]]
name = "replay"
path = "src/bin/replay.rs"

[[bin]]
name = "fuzzer"
path = "src/bin/fuzzer.rs"
required-features = ["fuzzing"]
