[package]
name = "parsarium-wav-rff-format-wav-harness"
version = "0.1.0"
edition = "2024"

[dependencies]
rff-format = "=0.4.6"
rff-format-wav = "=0.4.6"
serde_json = "=1.0.145"
libfuzzer-sys = { version = "=0.4.13", optional = true }

[features]
fuzzing = ["dep:libfuzzer-sys"]

[[bin]]
name = "replay"
path = "src/bin/replay.rs"

[[bin]]
name = "fuzzer"
path = "src/bin/fuzzer.rs"
required-features = ["fuzzing"]
