[package]
name = "parsarium-json-aws-smithy-json-harness"
version = "0.1.0"
edition = "2024"

[dependencies]
aws-smithy-json = "=0.65.1"
aws-smithy-types = "=1.9.1"
serde_json = "=1.0.154"
libfuzzer-sys = { version = "=0.4.13", optional = true }

[features]
fuzzing = ["dep:libfuzzer-sys"]

[[bin]]
name = "replay"
path = "src/bin/replay.rs"

[[bin]]
name = "fuzzer"
path = "src/bin/fuzzer.rs"
required-features = ["fuzzing"]
