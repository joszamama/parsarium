[package]
name = "parsarium-pdf-oxidize-pdf-harness"
version = "0.1.0"
edition = "2024"

[dependencies]
oxidize-pdf = { version = "=5.5.7", default-features = false, features = ["compression"] }
serde_json = "=1.0.145"
libfuzzer-sys = { version = "=0.4.13", optional = true }

[features]
fuzzing = ["dep:libfuzzer-sys"]

[[bin]]
name = "replay"
path = "src/bin/replay.rs"

[[bin]]
name = "fuzzer"
path = "src/bin/fuzzer.rs"
required-features = ["fuzzing"]
