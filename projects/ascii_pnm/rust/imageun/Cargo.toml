[package]
name = "parsarium-ascii-pnm-imageun-harness"
version = "0.1.0"
edition = "2024"

[dependencies]
imageun = { version = "=0.0.0", default-features = false, features = ["pnm"] }
serde_json = "=1.0.154"
libfuzzer-sys = { version = "=0.4.13", optional = true }

[features]
fuzzing = ["dep:libfuzzer-sys"]

[[bin]]
name = "replay"
path = "src/bin/replay.rs"

[[bin]]
name = "fuzzer"
path = "src/bin/fuzzer.rs"
required-features = ["fuzzing"]
