[package]
name = "parsarium-ascii-pnm-opencv-no-c-imgcodecs-harness"
version = "0.1.0"
edition = "2024"

[dependencies]
opencv-no-c-imgcodecs = "=0.1.0"
opencv-no-c-core = "=0.1.0"
serde_json = "=1.0.154"
libfuzzer-sys = { version = "=0.4.13", optional = true }

[features]
fuzzing = ["dep:libfuzzer-sys"]

[[bin]]
name = "replay"
path = "src/bin/replay.rs"

[[bin]]
name = "fuzzer"
path = "src/bin/fuzzer.rs"
required-features = ["fuzzing"]
