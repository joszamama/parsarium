[package]
name = "parsarium-ascii-pnm-unicraft-harness"
version = "0.1.0"
edition = "2024"

[dependencies]
serde_json = "=1.0.154"
unicraft = { version = "=0.1.2", default-features = false, features = ["2d"] }
libfuzzer-sys = { version = "=0.4.13", optional = true }

[features]
fuzzing = ["dep:libfuzzer-sys"]

[[bin]]
name = "replay"
path = "src/bin/replay.rs"

[[bin]]
name = "fuzzer"
path = "src/bin/fuzzer.rs"
required-features = ["fuzzing"]
