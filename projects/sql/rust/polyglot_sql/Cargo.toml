[package]
name = "parsarium-sql-polyglot-sql-harness"
version = "0.1.0"
edition = "2024"

[dependencies]
polyglot-sql = { version = "=0.14.1", default-features = false, features = ["ast-tools"] }
serde_json = "=1.0.154"
libfuzzer-sys = { version = "=0.4.13", optional = true }

[features]
fuzzing = ["dep:libfuzzer-sys"]

[[bin]]
name = "replay"
path = "src/bin/replay.rs"

[[bin]]
name = "fuzzer"
path = "src/bin/fuzzer.rs"
required-features = ["fuzzing"]
