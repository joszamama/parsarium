[package]
name = "parsarium-zip-archiver-rs-harness"
version = "0.1.0"
edition = "2024"

[dependencies]
archiver-rs = { version = "=0.5.1", default-features = false, features = ["zip"] }
serde_json = "=1.0.145"
libfuzzer-sys = { version = "=0.4.13", optional = true }

[features]
fuzzing = ["dep:libfuzzer-sys"]

[[bin]]
name = "replay"
path = "src/bin/replay.rs"

[[bin]]
name = "fuzzer"
path = "src/bin/fuzzer.rs"
required-features = ["fuzzing"]
