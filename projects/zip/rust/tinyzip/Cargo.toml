[package]
name = "parsarium-zip-tinyzip-harness"
version = "0.1.0"
edition = "2024"

[dependencies]
flate2 = "=1.1.5"
serde_json = "=1.0.145"
tinyzip = { version = "=0.4.0", features = ["std"] }
libfuzzer-sys = { version = "=0.4.13", optional = true }

[features]
fuzzing = ["dep:libfuzzer-sys"]

[[bin]]
name = "replay"
path = "src/bin/replay.rs"

[[bin]]
name = "fuzzer"
path = "src/bin/fuzzer.rs"
required-features = ["fuzzing"]
