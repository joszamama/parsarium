[package]
name = "parsarium-zip-async-zip-harness"
version = "0.1.0"
edition = "2024"

[dependencies]
futures-lite = "=2.6.1"
pollster = "=0.4.0"
serde_json = "=1.0.145"
upstream_async_zip = { package = "async_zip", version = "=0.0.19", features = ["deflate"] }
libfuzzer-sys = { version = "=0.4.13", optional = true }

[features]
fuzzing = ["dep:libfuzzer-sys"]

[[bin]]
name = "replay"
path = "src/bin/replay.rs"

[[bin]]
name = "fuzzer"
path = "src/bin/fuzzer.rs"
required-features = ["fuzzing"]
