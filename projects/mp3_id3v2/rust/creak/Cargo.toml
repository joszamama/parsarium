[package]
name = "parsarium-mp3-id3v2-creak-harness"
version = "0.1.0"
edition = "2024"

[dependencies]
creak = { version = "=0.3.0", default-features = false, features = ["mp3"] }
serde_json = "=1.0.145"
libfuzzer-sys = { version = "=0.4.13", optional = true }

[features]
fuzzing = ["dep:libfuzzer-sys"]

[[bin]]
name = "replay"
path = "src/bin/replay.rs"

[[bin]]
name = "fuzzer"
path = "src/bin/fuzzer.rs"
required-features = ["fuzzing"]
