[package]
name = "parsarium-http11-http-muncher-harness"
version = "0.1.0"
edition = "2024"

[dependencies]
http-muncher = "=0.3.2"
http_parser = "=0.0.2"
serde_json = "=1.0.145"
libfuzzer-sys = { version = "=0.4.13", optional = true }

[features]
fuzzing = ["dep:libfuzzer-sys"]

[[bin]]
name = "replay"
path = "src/bin/replay.rs"

[[bin]]
name = "fuzzer"
path = "src/bin/fuzzer.rs"
required-features = ["fuzzing"]
