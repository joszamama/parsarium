[package]
name = "parsarium-dns-packet-dissector-dns-harness"
version = "0.1.0"
edition = "2024"

[dependencies]
packet-dissector-dns = { version = "=0.6.3" }
packet-dissector-core = { version = "=0.6.3" }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
libfuzzer-sys = { version = "=0.4.13", optional = true }

[features]
fuzzing = ["dep:libfuzzer-sys"]

[[bin]]
name = "replay"
path = "src/bin/replay.rs"

[[bin]]
name = "fuzzer"
path = "src/bin/fuzzer.rs"
required-features = ["fuzzing"]
