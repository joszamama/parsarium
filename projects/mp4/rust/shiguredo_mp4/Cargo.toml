[package]
name = "parsarium-mp4-shiguredo-mp4-harness"
version = "0.1.0"
edition = "2024"

[dependencies]
serde_json = "=1.0.145"
shiguredo_mp4 = "=2026.6.0-canary.2"
libfuzzer-sys = { version = "=0.4.13", optional = true }

[features]
fuzzing = ["dep:libfuzzer-sys"]

[[bin]]
name = "replay"
path = "src/bin/replay.rs"

[[bin]]
name = "fuzzer"
path = "src/bin/fuzzer.rs"
required-features = ["fuzzing"]
