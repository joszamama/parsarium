[package]
name = "parsarium-png-zenpng-harness"
version = "0.1.0"
edition = "2024"

[dependencies]
enough = "=0.4.5"
serde_json = "=1.0.145"
zenpng = { version = "=0.1.4", default-features = false }
libfuzzer-sys = { version = "=0.4.13", optional = true }

[features]
fuzzing = ["dep:libfuzzer-sys"]

[[bin]]
name = "replay"
path = "src/bin/replay.rs"

[[bin]]
name = "fuzzer"
path = "src/bin/fuzzer.rs"
required-features = ["fuzzing"]
