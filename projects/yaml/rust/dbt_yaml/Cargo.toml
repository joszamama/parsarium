[package]
name = "parsarium-yaml-dbt-yaml-harness"
version = "0.1.0"
edition = "2024"

[dependencies]
serde_json = "=1.0.145"
dbt-yaml = "=0.10.8"
libfuzzer-sys = { version = "=0.4.13", optional = true }

[features]
fuzzing = ["dep:libfuzzer-sys"]

[[bin]]
name = "replay"
path = "src/bin/replay.rs"

[[bin]]
name = "fuzzer"
path = "src/bin/fuzzer.rs"
required-features = ["fuzzing"]
