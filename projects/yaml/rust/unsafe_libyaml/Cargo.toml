[package]
name = "parsarium-yaml-unsafe-libyaml-harness"
version = "0.1.0"
edition = "2024"

[dependencies]
serde_json = "=1.0.145"
unsafe-libyaml = "=0.2.11"
libfuzzer-sys = { version = "=0.4.13", optional = true }

[features]
fuzzing = ["dep:libfuzzer-sys"]

[[bin]]
name = "replay"
path = "src/bin/replay.rs"

[[bin]]
name = "fuzzer"
path = "src/bin/fuzzer.rs"
required-features = ["fuzzing"]
