[package]
name = "parsarium-mp3-minimp3-harness"
version = "0.1.0"
edition = "2024"

[dependencies]
minimp3 = { version = "=0.6.1", default-features = false, features = ["std"] }
minimp3-sys = "=0.6.0"
serde_json = "=1.0.145"
sha2 = "=0.10.9"
libfuzzer-sys = { version = "=0.4.13", optional = true }

[features]
fuzzing = ["dep:libfuzzer-sys"]

[[bin]]
name = "replay"
path = "src/bin/replay.rs"

[[bin]]
name = "fuzzer"
path = "src/bin/fuzzer.rs"
required-features = ["fuzzing"]

[[bin]]
name = "afl_target"
path = "src/bin/afl_target.rs"
