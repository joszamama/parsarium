[package]
name = "parsarium-mp3-rusty-mp3-harness"
version = "0.1.0"
edition = "2024"

[dependencies]
serde_json = "=1.0.145"
rusty_mp3 = { version = "=1.0.6", default-features = false }
sha2 = "=0.10.9"
libfuzzer-sys = { version = "=0.4.13", optional = true }

[features]
fuzzing = ["dep:libfuzzer-sys"]

[[bin]]
name = "replay"
path = "src/bin/replay.rs"

[[bin]]
name = "fuzzer"
path = "src/bin/fuzzer.rs"
required-features = ["fuzzing"]
