[package]
name = "parsarium-mp3-id3v2-nanomp3-harness"
version = "0.1.0"
edition = "2024"

[dependencies]
nanomp3 = "=0.2.0"
serde_json = "=1.0.145"
libfuzzer-sys = { version = "=0.4.13", optional = true }

[features]
fuzzing = ["dep:libfuzzer-sys"]

[[bin]]
name = "replay"
path = "src/bin/replay.rs"

[[bin]]
name = "fuzzer"
path = "src/bin/fuzzer.rs"
required-features = ["fuzzing"]
